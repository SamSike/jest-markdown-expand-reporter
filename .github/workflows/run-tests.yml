name: Run Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: 
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        
      - name: Enable Corepack
        run: corepack enable

      - name: Setup
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'


      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: yarn test